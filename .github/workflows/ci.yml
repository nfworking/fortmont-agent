name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
      - run: go mod tidy
      - run: gofmt -w $(find . -name '*.go' -type f)
      - run: git diff --exit-code
      - run: go test ./...
      - run: go vet ./...
      - run: go build ./cmd/agent
