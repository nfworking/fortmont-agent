name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Tidy
        run: go mod tidy

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./cmd/agent

  release:
    name: Build & Release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: true

      - name: Calculate version
        id: version
        shell: bash
        run: |
          git fetch --tags

          latest=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)

          if [ -z "$latest" ]; then
            base="0.1.0"
          else
            version="${latest#v}"

            major=$(echo "$version" | cut -d. -f1)
            minor=$(echo "$version" | cut -d. -f2)
            patch=$(echo "$version" | cut -d. -f3)

            patch=$((patch + 1))
            base="$major.$minor.$patch"
          fi

          existing=$(git tag --list "v${base}-rc.*" | sort -V | tail -n 1)

          if [ -z "$existing" ]; then
            rc=1
          else
            rc_version="${existing#v${base}-rc.}"
            rc=$((rc_version + 1))
          fi

          version="v${base}-rc.${rc}"

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Release version: $version"

      - name: Build Linux amd64
        env:
          CGO_ENABLED: 0
          GOOS: linux
          GOARCH: amd64
        run: |
          mkdir -p dist
          go mod tidy
          go build \
            -ldflags "-X main.Version=${{ steps.version.outputs.version }}" \
            -o dist/fortmont-agent-linux-amd64 \
            ./cmd/agent

      - name: Build Linux arm64
        env:
          CGO_ENABLED: 0
          GOOS: linux
          GOARCH: arm64
        run: |
          go build \
            -ldflags "-X main.Version=${{ steps.version.outputs.version }}" \
            -o dist/fortmont-agent-linux-arm64 \
            ./cmd/agent

      - name: Build Windows amd64
        env:
          CGO_ENABLED: 0
          GOOS: windows
          GOARCH: amd64
        run: |
          go build \
            -ldflags "-X main.Version=${{ steps.version.outputs.version }}" \
            -o dist/fortmont-agent-windows-amd64.exe \
            ./cmd/agent

      - name: Build Windows arm64
        env:
          CGO_ENABLED: 0
          GOOS: windows
          GOARCH: arm64
        run: |
          go build \
            -ldflags "-X main.Version=${{ steps.version.outputs.version }}" \
            -o dist/fortmont-agent-windows-arm64.exe \
            ./cmd/agent

      - name: Create archives
        run: |
          cd dist

          tar -czf fortmont-agent-${{ steps.version.outputs.version }}-linux-amd64.tar.gz \
            fortmont-agent-linux-amd64

          tar -czf fortmont-agent-${{ steps.version.outputs.version }}-linux-arm64.tar.gz \
            fortmont-agent-linux-arm64

          zip fortmont-agent-${{ steps.version.outputs.version }}-windows-amd64.zip \
            fortmont-agent-windows-amd64.exe

          zip fortmont-agent-${{ steps.version.outputs.version }}-windows-arm64.zip \
            fortmont-agent-windows-arm64.exe

          rm fortmont-agent-linux-amd64
          rm fortmont-agent-linux-arm64
          rm fortmont-agent-windows-amd64.exe
          rm fortmont-agent-windows-arm64.exe

      - name: Create release tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git tag "${{ steps.version.outputs.version }}"
          git push origin "${{ steps.version.outputs.version }}"

      - name: Create GitHub pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: Fortmont Agent ${{ steps.version.outputs.version }}
          prerelease: true
          generate_release_notes: true
          files: |
            dist/*