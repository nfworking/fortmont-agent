name: CI

on:
  push:
    branches: [main]
    tags:
      - "v*.*.*"
  pull_request:

permissions:
  contents: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Tidy
        run: go mod tidy

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./cmd/agent

  release:
    name: Build & Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: true

      - name: Validate release version
        shell: bash
        run: |
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tags must use semantic versioning such as v0.2.0"
            exit 1
          fi

      - name: Build Linux amd64
        env:
          CGO_ENABLED: 0
          GOOS: linux
          GOARCH: amd64
        run: |
          mkdir -p dist
          go build -ldflags "-X main.Version=${GITHUB_REF_NAME}" -o dist/meshscale-agent-linux-amd64 ./cmd/agent

      - name: Build Linux arm64
        env:
          CGO_ENABLED: 0
          GOOS: linux
          GOARCH: arm64
        run: |
          go build -ldflags "-X main.Version=${GITHUB_REF_NAME}" -o dist/meshscale-agent-linux-arm64 ./cmd/agent

      - name: Build Windows amd64
        env:
          CGO_ENABLED: 0
          GOOS: windows
          GOARCH: amd64
        run: |
          go build -ldflags "-X main.Version=${GITHUB_REF_NAME}" -o dist/meshscale-agent-windows-amd64.exe ./cmd/agent

      - name: Build Windows arm64
        env:
          CGO_ENABLED: 0
          GOOS: windows
          GOARCH: arm64
        run: |
          go build -ldflags "-X main.Version=${GITHUB_REF_NAME}" -o dist/meshscale-agent-windows-arm64.exe ./cmd/agent

      - name: Build macOS amd64
        env:
          CGO_ENABLED: 0
          GOOS: darwin
          GOARCH: amd64
        run: |
          go build -ldflags "-X main.Version=${GITHUB_REF_NAME}" -o dist/meshscale-agent-darwin-amd64 ./cmd/agent

      - name: Build macOS arm64
        env:
          CGO_ENABLED: 0
          GOOS: darwin
          GOARCH: arm64
        run: |
          go build -ldflags "-X main.Version=${GITHUB_REF_NAME}" -o dist/meshscale-agent-darwin-arm64 ./cmd/agent

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: MeshScale Agent ${{ github.ref_name }}
          prerelease: false
          draft: false
          generate_release_notes: false
          body: |
            # MeshScale Agent ${{ github.ref_name }}

            This is the first stable production release of **MeshScale Agent**.

            MeshScale Agent is the node-side runtime for MeshScale, providing secure connectivity between infrastructure and the MeshScale platform, including operation behind NAT and CGNAT environments.

            ## Highlights

            - Secure WebSocket agent connectivity with gateway health checks, latency measurement, reconnect handling and gateway failover.
            - Agent enrollment and persistent identity handling, including one-time bootstrap token consumption.
            - Cross-platform service management for Windows and Linux, with managed startup, status and uninstall operations.
            - Cross-platform system telemetry collection and reporting over the authenticated WebSocket connection.
            - Dynamic plugin runtime and lifecycle management.
            - Proxmox integration with node telemetry collection and canonical `proxmoxv2` telemetry support.
            - UniFi plugin integration.
            - Persistent plugin installation state across agent restarts.
            - Encrypted local plugin credential storage.
            - Plugin installation/removal lifecycle reporting and improved status handling.
            - Improved WebSocket resilience, heartbeat handling, diagnostics and error isolation.
            - Production gateway configuration using `wss://ws.meshscale.cloud/ws`.

            ## Downloads

            Prebuilt raw binaries are provided for Linux, Windows and macOS on amd64 and arm64 architectures.

            If you want to download and install MeshScale Agent, head over to **https://meshscale.cloud/agent/download**.

            ## Supported artifacts

            - Linux amd64 — `meshscale-agent-linux-amd64`
            - Linux arm64 — `meshscale-agent-linux-arm64`
            - Windows amd64 — `meshscale-agent-windows-amd64.exe`
            - Windows arm64 — `meshscale-agent-windows-arm64.exe`
            - macOS amd64 — `meshscale-agent-darwin-amd64`
            - macOS arm64 (Apple Silicon) — `meshscale-agent-darwin-arm64`

            This release consolidates the agent, service-management, telemetry, gateway reliability and Phase 2 plugin work merged into `main`.
          files: |
            dist/meshscale-agent-linux-amd64
            dist/meshscale-agent-linux-arm64
            dist/meshscale-agent-windows-amd64.exe
            dist/meshscale-agent-windows-arm64.exe
            dist/meshscale-agent-darwin-amd64
            dist/meshscale-agent-darwin-arm64
